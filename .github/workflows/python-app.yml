name: Python application

env:
  IMAGE_NAME: vniciuslobo2/senai_api_aws

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: compilar projeto
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test app
      run: |
        PYTHONPATH=. pytest tests/ -v --tb=short

  imagem:
    name: construindo imagem no docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: login no docker
        uses: docker/login-action@v4.1.0
        with:
          username: ${{secrets.DOCKER_USUARIO}}
          password: ${{secrets.DOCKER_PWD}}
      - name: Build e Publish
        uses: docker/build-push-action@v7.1.0
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{github.sha}}

  deploy_homologacao:
    name: Deploy em Homologacao
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy na EC2 Homologacao via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.KEY}}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop senai_api_homol 2>/dev/null || true
            sudo docker rm senai_api_homol 2>/dev/null || true
            sudo docker run --name senai_api_homol -d --restart unless-stopped -p 8080:8080 ${{ env.IMAGE_NAME }}:latest
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy Homologacao feito com sucesso!"

  deploy_producao:
    name: Deploy em Producao
    runs-on: ubuntu-latest
    needs: imagem
    if: github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Deploy na EC2 Producao via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST_PRD}}
          username: ${{secrets.EC2_USER_PRD}}
          key: ${{secrets.KEY_PRD}}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop senai_api_aws 2>/dev/null || true
            sudo docker rm senai_api_aws 2>/dev/null || true
            sudo docker run --name senai_api_aws -d --restart unless-stopped -p 80:8080 ${{ env.IMAGE_NAME }}:latest
            sleep 5
            curl -f http://localhost/health || exit 1
            echo "Deploy Producao feito com sucesso!"
